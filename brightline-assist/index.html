<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brightline Assist</title>
<meta name="description" content="The Brightline portals after onboarding, with the assistant from Network Assist built in: a briefing to land on, and an answer that takes over when you ask.">
<link rel="stylesheet" href="assist.css">
<link rel="stylesheet" href="assist-v5.css">
</head>
<body>

<main class="signin" id="signin">
  <div class="signin-b">
    <div class="mark"><i></i><span>Discover Global Network</span></div>
    <h1>Sign in</h1>
    <p>Choose who you are. The portal opens where they left it on the morning of June 2.</p>
    <div class="accounts" id="accounts"></div>
    <p class="fine">Brightline Bank, its merchants, every person and every figure are invented.</p>
  </div>
</main>

<div class="app" id="app" data-state="home" hidden>
  <header class="appbar" id="hdr"></header>
  <div class="body">
    <aside class="sb" id="sb"></aside>
    <main class="mn" id="main"></main>
  </div>
  <div class="composer" id="composer"><div class="assist">
    <span class="parse" id="parse"></span>
    <div class="bar"><div class="box ring" id="cbox"><i class="aimark"></i><span class="cin"><span id="ctext">Ask a follow-up</span><span class="caret" id="caret"></span></span><kbd class="tabk">Tab</kbd><span class="send" id="csend"><svg viewBox="0 0 14 14"><path d="M7 12V2M2.5 6.5 7 2l4.5 4.5"/></svg></span></div><button class="cls" type="button" id="cclose" aria-label="Close the assistant and go back to your briefing" title="Close · back to your briefing"><svg class="gn-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  </div></div>
</div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="live" class="sr" aria-live="polite"></div>

<script src="design-system/icons.js"></script>
<script src="data.js"></script>
<script src="assist.js"></script>
</body>
</html>
